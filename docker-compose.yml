# NOTA: Docker ya NO es necesario para correr este proyecto — Chroma corre
# embebido en el propio proceso de Python, sin servidor aparte. Este archivo
# queda como una forma opcional de containerizar la API y la UI más adelante
# (por ejemplo si lo despleg\u00e1s en un servidor), pero el camino recomendado
# para desarrollo local es correr todo directo con Python (ver README).
services:
  api:
    build: .
    container_name: rag-api
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    env_file: .env
    volumes:
      - ./data:/app/data
    ports:
      - "8000:8000"

  ui:
    build: .
    container_name: rag-ui
    command: streamlit run app/streamlit_app.py --server.address 0.0.0.0
    env_file: .env
    volumes:
      - ./data:/app/data
    ports:
      - "8501:8501"
